const app=document.getElementById('app'), key='belgrade-quiz-night-v3';let state={name:'',answers:{},round:-1,done:false};try{let s=JSON.parse(localStorage.getItem(key));if(s)state=s}catch{};const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};const count=()=>Object.keys(state.answers).length;const go=r=>{state.round=r;save();render();window.scrollTo(0,0)};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function picture(q){return q[6]?'<img class="question-image" loading="lazy" src="'+esc(q[6])+'" alt="'+esc(q[7])+'" onerror="this.style.display=\'none\';this.nextElementSibling.hidden=false"><p hidden class="image-note">'+esc(q[7])+'</p>':''}function score(){return rounds.map((r,i)=>r[1].reduce((n,q,j)=>n+(state.answers[i+'-'+j]===q[5]?1:0),0))}
function render(){if(state.done){const scores=score(),total=scores.reduce((a,b)=>a+b,0);app.innerHTML='<h2>Results · '+esc(state.name)+'</h2><div class="score">'+total+'/50</div>'+rounds.map((r,i)=>'<article>'+esc(r[0])+' <strong style="float:right">'+scores[i]+'/10</strong></article>').join('')+'<button id="share">Share score with host</button> <button class="secondary" id="review">Review answers</button><div id="details"></div>';document.getElementById('share').onclick=async()=>{let t='Quiz Night | '+state.name+' | '+total+'/50\n'+rounds.map((r,i)=>r[0]+': '+scores[i]+'/10').join('\n');try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);alert('Score copied — send it to the host.')}}catch{prompt('Copy your score:',t)}};document.getElementById('review').onclick=()=>{document.getElementById('details').innerHTML=rounds.map((r,i)=>'<h2>'+esc(r[0])+'</h2>'+r[1].map((q,j)=>'<article><b>'+esc(q[0])+'</b>'+picture(q)+'<p class="'+(state.answers[i+'-'+j]===q[5]?'correct':'wrong')+'">Your answer: '+esc(q[1+state.answers[i+'-'+j]]??'Unanswered')+'</p><p>Correct answer: '+esc(q[1+q[5]])+'</p></article>').join('')).join('')};return}
if(state.round<0){app.innerHTML='<h2>Ready to play?</h2><p class="muted">Choose one answer per question. No answers are revealed until you finish. No Googling!</p>'+rounds.map((r,i)=>'<div class="pill">'+(i+1)+' · '+esc(r[0])+'</div>').join(' ')+'<article><label for="team">Team or player name</label><p><input type="text" id="team" maxlength="70" placeholder="Enter your name" value="'+esc(state.name)+'"></p><button id="start">Start quiz</button></article>';document.getElementById('start').onclick=()=>{let n=document.getElementById('team').value.trim();if(!n){document.getElementById('team').focus();return}state.name=n;go(0)};return}
let i=state.round,r=rounds[i];app.innerHTML='<p class="muted">ROUND '+(i+1)+' / 5 · <span id="count">'+count()+'</span> / 50 answered</p><progress id="progress" max="50" value="'+count()+'"></progress><h2>'+esc(r[0])+'</h2>'+r[1].map((q,j)=>'<article><h3>'+(i*10+j+1)+'. '+esc(q[0])+'</h3>'+picture(q)+q.slice(1,5).map((a,k)=>'<label class="option"><input type="radio" name="q'+j+'" data-key="'+i+'-'+j+'" value="'+k+'" '+(state.answers[i+'-'+j]===k?'checked':'')+'><span>'+esc(a)+'</span></label>').join('')+'</article>').join('')+'<nav><button class="secondary" id="back">Back</button><button id="next">'+(i===4?'Submit quiz':'Next round')+'</button></nav><p id="error" role="alert" class="wrong"></p>';app.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{state.answers[el.dataset.key]=Number(el.value);save();document.getElementById('count').textContent=count();document.getElementById('progress').value=count()});document.getElementById('back').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>{if(r[1].some((q,j)=>state.answers[i+'-'+j]===undefined)){document.getElementById('error').textContent='Please answer all ten questions in this round.';return}if(i<4)go(i+1);else if(count()===50){state.done=true;save();render();window.scrollTo(0,0)}else{document.getElementById('error').textContent='Please complete all rounds.'}}}
