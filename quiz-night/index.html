<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belgrade Quiz Night</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b2d;color:#f5f5f2;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 18px 100px}header{border-bottom:1px solid #35465d;padding:24px 0}small,.muted{color:#b6c4d8}h1{font-size:clamp(38px,8vw,70px);line-height:1;margin:12px 0;letter-spacing:-3px}h2{font-size:30px;letter-spacing:-1px}h3{font-size:19px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:14px 18px;background:#f8c95c;color:#162238;font-weight:700}button.secondary{background:#263951;color:white}button:disabled{opacity:.45;cursor:not-allowed}input[type=text]{width:100%;padding:15px;border-radius:10px;border:1px solid #65768e;background:#18273b;color:white}article{background:#18273b;border:1px solid #34465c;border-radius:16px;padding:18px;margin:14px 0}label.option{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #3a4e66;border-radius:10px;margin:9px 0;cursor:pointer}label.option:has(input:checked){background:#32546d;border-color:#f8c95c}input[type=radio]{accent-color:#f8c95c;width:20px;height:20px;flex-shrink:0}nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}progress{width:100%;height:12px;accent-color:#f8c95c}.score{font-size:68px;font-weight:800;color:#f8c95c}.pill{display:inline-block;border:1px solid #65768e;border-radius:20px;padding:5px 12px;margin:4px 0}.correct{color:#8ee6b2}.wrong{color:#ffadad}footer{margin-top:30px;color:#b6c4d8;font-size:13px}a{color:#f8c95c}</style><main><header><small> BELGRADE • 2026 • INTERNATIONAL EDITION</small><h1>Quiz<br>Night.</h1><p>Five rounds. Fifty questions. One winning team.</p></header><div id="app"></div><footer>Unofficial social quiz · 2026 round covers events through 27 November.</footer></main><script>
const rounds=[["History of Expos",[["Which city hosted the Great Exhibition of 1851?","Paris","London","Vienna","Berlin",1],["Which landmark was built for the 1889 Paris exposition?","Arc de Triomphe","Sacré-Cœur","Eiffel Tower","Louvre Pyramid",2],["The original Ferris wheel debuted at which 1893 fair?","Chicago","New York","Boston","Philadelphia",0],["Which city hosted Expo 67?","Toronto","Vancouver","Ottawa","Montreal",3],["Which structure was built for Expo 58 in Brussels?","Space Needle","Atomium","Unisphere","CN Tower",1],["Which city hosted the first World Expo in Asia in 1970?","Tokyo","Seoul","Osaka","Shanghai",2],["Which city hosted the World Expo in 2010?","Shanghai","Beijing","Singapore","Hong Kong",0],["What was the central theme of Expo 2015 Milan?","Future mobility","Oceans","Digital cities","Feeding the Planet, Energy for Life",3],["Expo 2020 Dubai actually opened in which year?","2019","2021","2022","2023",1],["Which city is hosting the 2027 Specialised Expo?","Riyadh","Busan","Belgrade","Rome",2]]],["Geography & Language",[["What is the capital of Kazakhstan?","Astana","Almaty","Tashkent","Bishkek",0],["Which river flows through Vienna, Bratislava, Budapest and Belgrade?","Rhine","Elbe","Danube","Vistula",2],["Which country has Portuguese as its official language?","Argentina","Brazil","Chile","Colombia",1],["What does the Serbian word 'hvala' mean?","Hello","Goodbye","Please","Thank you",3],["Which country completely surrounds Lesotho?","Namibia","Botswana","South Africa","Mozambique",2],["Which language is primarily spoken in Iran?","Persian","Arabic","Turkish","Urdu",0],["Which continent has the most sovereign countries?","Asia","Africa","Europe","South America",1],["What is the capital of New Zealand?","Auckland","Christchurch","Dunedin","Wellington",3],["Which country has coastlines on both the Atlantic and Mediterranean?","Austria","Switzerland","Morocco","Hungary",2],["In which language does 'gracias' mean thank you?","Spanish","Italian","Greek","German",0]]],["Food of the World",[["Which country is associated with the dish khachapuri?","Armenia","Georgia","Turkey","Greece",1],["What is the main ingredient in hummus?","Lentils","White beans","Chickpeas","Peas",2],["Which country is the home of traditional pho?","Vietnam","Thailand","Laos","Malaysia",0],["Which cheese is traditionally used in a Greek salad?","Halloumi","Ricotta","Manchego","Feta",3],["What is the principal ingredient of Japanese miso paste?","Sesame seeds","Soybeans","Rice noodles","Seaweed",1],["Which country is associated with poutine?","Belgium","USA","Canada","France",2],["What type of food is ajvar?","Roasted pepper relish","Sweet pastry","Noodle soup","Cured sausage",0],["Which spice gives many paellas their characteristic golden colour?","Cumin","Paprika","Cinnamon","Saffron",3],["What is the principal ingredient of guacamole?","Tomato","Avocado","Cucumber","Courgette",1],["What is the traditional protein in a classic Peruvian ceviche?","Beef","Chicken","Raw fish","Pork",2]]],["Movie Stars & Cinema",[["Who directed Jurassic Park (1993)?","Steven Spielberg","James Cameron","Ridley Scott","George Lucas",0],["Who played Maximus in Gladiator (2000)?","Brad Pitt","Russell Crowe","Hugh Jackman","Gerard Butler",1],["Which film won Best Picture at the 2020 Oscars?","1917","Joker","Once Upon a Time in Hollywood","Parasite",3],["Which actor played the title character in the 2023 film Oppenheimer?","Matt Damon","Robert Downey Jr.","Cillian Murphy","Christian Bale",2],["Which fictional country appears in Black Panther?","Wakanda","Genovia","Sokovia","Latveria",0],["Who directed The Grand Budapest Hotel?","Christopher Nolan","Wes Anderson","David Fincher","Tim Burton",1],["Which actress played Mia in La La Land?","Jennifer Lawrence","Margot Robbie","Anne Hathaway","Emma Stone",3],["Which film features the fictional hotel called the Overlook?","Psycho","The Exorcist","The Shining","Misery",2],["Who played Jack Dawson in Titanic?","Leonardo DiCaprio","Tom Cruise","Matt Damon","Ben Affleck",0],["Which film features the song 'My Heart Will Go On'?","The Bodyguard","Titanic","Pretty Woman","Ghost",1]]],["2026 in Review",[["Which country hosted the 2026 Winter Olympics?","France","Switzerland","Italy","Austria",2],["Which UK city hosted the 2026 Commonwealth Games?","Glasgow","Birmingham","Manchester","Cardiff",0],["The USA marked how many years since the Declaration of Independence on 4 July 2026?","200","225","275","250",3],["Which NASA mission sent astronauts around the Moon in April 2026?","Artemis I","Artemis II","Artemis III","Apollo 18",1],["Which three countries hosted the men's FIFA World Cup in 2026?","Spain, Portugal, Morocco","USA, Brazil, Argentina","USA, Canada, Mexico","UK, Ireland, France",2],["How many teams competed at the expanded 2026 men's FIFA World Cup?","48","32","40","64",0],["Which nation won the 2026 men's FIFA World Cup?","Argentina","Brazil","France","Spain",3],["Which European country was in the path of totality of the 12 August 2026 solar eclipse?","Germany","Spain","Poland","Greece",1],["Which Canadian astronaut flew on Artemis II?","Chris Hadfield","David Saint-Jacques","Jeremy Hansen","Marc Garneau",2],["Which US state hosted the launch of Artemis II?","Florida","Texas","California","Virginia",0]]]];
const app=document.getElementById('app'), key='belgrade-quiz-night-v1';let state={name:'',answers:{},round:-1,done:false};try{let s=JSON.parse(localStorage.getItem(key));if(s)state=s}catch{};const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};const count=()=>Object.keys(state.answers).length;const go=r=>{state.round=r;save();render();window.scrollTo(0,0)};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function score(){return rounds.map((r,i)=>r[1].reduce((n,q,j)=>n+(state.answers[i+'-'+j]===q[5]?1:0),0))}
function render(){if(state.done){const scores=score(),total=scores.reduce((a,b)=>a+b,0);app.innerHTML='<h2>Results · '+esc(state.name)+'</h2><div class="score">'+total+'/50</div>'+rounds.map((r,i)=>'<article>'+esc(r[0])+' <strong style="float:right">'+scores[i]+'/10</strong></article>').join('')+'<button id="share">Share score with host</button> <button class="secondary" id="review">Review answers</button><div id="details"></div>';document.getElementById('share').onclick=async()=>{let t='Quiz Night | '+state.name+' | '+total+'/50\n'+rounds.map((r,i)=>r[0]+': '+scores[i]+'/10').join('\n');try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);alert('Score copied — send it to the host.')}}catch{prompt('Copy your score:',t)}};document.getElementById('review').onclick=()=>{document.getElementById('details').innerHTML=rounds.map((r,i)=>'<h2>'+esc(r[0])+'</h2>'+r[1].map((q,j)=>'<article><b>'+esc(q[0])+'</b><p class="'+(state.answers[i+'-'+j]===q[5]?'correct':'wrong')+'">Your answer: '+esc(q[1+state.answers[i+'-'+j]]??'Unanswered')+'</p><p>Correct answer: '+esc(q[1+q[5]])+'</p></article>').join('')).join('')};return}
if(state.round<0){app.innerHTML='<h2>Ready to play?</h2><p class="muted">Choose one answer per question. No answers are revealed until you finish. No Googling!</p>'+rounds.map((r,i)=>'<div class="pill">'+(i+1)+' · '+esc(r[0])+'</div>').join(' ')+'<article><label for="team">Team or player name</label><p><input type="text" id="team" maxlength="70" placeholder="Enter your name" value="'+esc(state.name)+'"></p><button id="start">Start quiz</button></article>';document.getElementById('start').onclick=()=>{let n=document.getElementById('team').value.trim();if(!n){document.getElementById('team').focus();return}state.name=n;go(0)};return}
let i=state.round,r=rounds[i];app.innerHTML='<p class="muted">ROUND '+(i+1)+' / 5 · <span id="count">'+count()+'</span> / 50 answered</p><progress id="progress" max="50" value="'+count()+'"></progress><h2>'+esc(r[0])+'</h2>'+r[1].map((q,j)=>'<article><h3>'+(i*10+j+1)+'. '+esc(q[0])+'</h3>'+q.slice(1,5).map((a,k)=>'<label class="option"><input type="radio" name="q'+j+'" data-key="'+i+'-'+j+'" value="'+k+'" '+(state.answers[i+'-'+j]===k?'checked':'')+'><span>'+esc(a)+'</span></label>').join('')+'</article>').join('')+'<nav><button class="secondary" id="back">Back</button><button id="next">'+(i===4?'Submit quiz':'Next round')+'</button></nav><p id="error" role="alert" class="wrong"></p>';app.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{state.answers[el.dataset.key]=Number(el.value);save();document.getElementById('count').textContent=count();document.getElementById('progress').value=count()});document.getElementById('back').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>{if(r[1].some((q,j)=>state.answers[i+'-'+j]===undefined)){document.getElementById('error').textContent='Please answer all ten questions in this round.';return}if(i<4)go(i+1);else if(count()===50){state.done=true;save();render();window.scrollTo(0,0)}else{document.getElementById('error').textContent='Please complete all rounds.'}}}
render();</script></html>
